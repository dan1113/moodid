</style><body><header><button class="logo" onclick="home()">MOODID.</button><nav class="nav"><span class="tiny">A PERSONAL SENSORY ARCHIVE</span><button onclick="archive()">나의 아카이브 ↗</button></nav></header><main id="app" class="wrap"></main><div id="toast" role="status"></div><script>
const DB=__DB__;
const PIN_CATALOG=__PINS__;

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let answers={},step=0,current=null,busy=false;
function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('저장 공간을 사용할 수 없어요.')}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
const img=['https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=85','https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=700&q=85','https://images.unsplash.com/photo-1511081692775-05d0f180a065?auto=format&fit=crop&w=800&q=85'];
function home(){busy=false;$('#app').innerHTML=`<section class="hero"><div class="eyebrow tiny"><span>MELONADE LAB / PROJECT 03</span><span>DISCOVER YOUR AESTHETIC — 2026</span></div><h1>MOODID.</h1><div class="under"><div class="tagline">당신이 아름답다고 느끼는 것들.<br>그 안에, 당신만의 미감이 있어요.</div><button class="pill" onclick="start()" aria-label="미감 발견 시작">↗</button></div><div class="collage">${img.map((u,i)=>`<div class="photo"><img src="${u}" alt="${['숲에 스며드는 빛','책과 사물의 질감','따뜻한 공간의 분위기'][i]}"><span class="caption">0${i+1} / ${['THE AIR YOU LOVE','THE THINGS YOU FEEL','THE WORLD YOU KEEP'][i]}</span></div>`).join('')}</div><div class="intro"><p>좋아하는 시간, 공기, 색과 소리를 모아보세요.<br>흩어져 있던 취향이 하나의 세계로 이어집니다.</p><div><button class="cta" onclick="start()">나의 미감 발견하기 <span>↗</span></button><p style="font-size:10px;margin:12px 0 0">약 3분 · 12개의 감각 · 여러 개 선택 가능</p></div></div></section><div class="rule senses">${DB.map(d=>`<span>${d.en} / ${d.label}</span>`).join('')}</div><section class="about"><div><span class="tiny">YOU ARE MORE THAN A TYPE.</span><h2>취향은 하나의 유형보다<br>훨씬 넓으니까.</h2></div><div><p>차가운 새벽을 좋아하면서 따뜻한 조명에 끌릴 수도 있어요. 모순처럼 보이는 취향도 당신의 세계에서는 자연스럽습니다.</p><p>MOODID는 서로 다른 감각의 공통점과 대비를 발견합니다. 당신이 고른 것들을 바탕으로 미감의 이름, 색, 그리고 새로운 영감을 만나보세요.</p><button class="secondary" onclick="sample()">결과 미리 보기 ↗</button></div></section>${foot()}`}
function foot(){return '<footer><span>MELONADE LAB. © 2026</span><span>COLLECT YOUR SENSES. DISCOVER YOUR WORLD.</span></footer>'}
function start(){const draft=read('moodid-draft',null);answers=draft?.answers||{};step=draft?.step||0;question()}
function question(){save('moodid-draft',{answers,step});const d=DB[step];$('#app').innerHTML=`<div class="qhead tiny"><span>COLLECT YOUR SENSES</span><span>${String(step+1).padStart(2,'0')} / 12</span></div><div class="progress"><i style="width:${(step+1)/12*100}%"></i></div><section class="question"><span class="tiny">${d.en} / ${d.label}</span><h1>${d.q}</h1><p class="muted">이미지와 감각을 함께 느껴보세요. 최대 3개까지, 정답은 없어요.</p><div class="options">${d.options.map((o,j)=>`<button class="option ${(answers[step]||[]).includes(o.id)?'selected':''}" aria-pressed="${(answers[step]||[]).includes(o.id)}" onclick="choose('${o.id}')"><div class="swatch"><img src="/assets/options/${o.id}.webp" alt="${esc(o.name)}의 감각을 표현한 이미지" width="480" height="320" decoding="async"></div><span class="check">${(answers[step]||[]).includes(o.id)?'✓':''}</span><strong>${step===4?'<span class="color-dot" style="background:'+o.color+'"></span>':''}${o.name}</strong><small>${o.en}</small></button>`).join('')}</div><div class="qfoot"><button class="secondary" onclick="back()">← ${step?'이전':'처음으로'}</button><span class="muted">${(answers[step]||[]).length}개 선택</span><button class="cta" onclick="next()" ${!(answers[step]||[]).length?'disabled':''}>${step===11?'미감 발견하기':'다음 감각'} <span>→</span></button></div><p class="muted" style="font-size:10px;margin-top:25px">선택 이미지는 AI로 생성한 감각 표현 예시입니다. 선택은 이 브라우저에 저장됩니다. 분석 시 선택한 감각 정보가 Google Gemini로 전송됩니다.</p></section>`}
function choose(id){let a=answers[step]||[];if(a.includes(id))a=a.filter(x=>x!==id);else if(a.length<3)a.push(id);else return toast('최대 3개까지 선택할 수 있어요.');answers[step]=a;question()}function back(){if(step){step--;question()}else home()}function next(){if(!answers[step]?.length)return;if(step<11){step++;question();window.scrollTo(0,0)}else analyze()}
