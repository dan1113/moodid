d-label{order:initial;writing-mode:vertical-rl;display:flex;justify-content:space-between;letter-spacing:1.8px;padding:0;font-size:10px}.aesthetic-card .moodboard-row img{height:100%;max-height:none}.summary-palette{height:48px}@media(max-width:700px){.aesthetic-card{padding:24px 20px}.result-moodboard{gap:20px}.moodboard-row{grid-template-columns:14px 44px minmax(0,1fr);gap:12px;height:auto}.moodboard-row>a{aspect-ratio:3/2}.moodboard-label{font-size:8px;letter-spacing:1px}.moodboard-color{height:auto}.aesthetic-card .moodboard-row img{height:100%;max-height:none}.aesthetic-card .desc{margin-bottom:26px}.result-wordmark{font-size:clamp(56px,17vw,90px)}}</style><body><header><button class="logo" onclick="home()">MOODID.</button><nav class="nav"><span class="tiny">A PERSONAL SENSORY ARCHIVE</span><button onclick="archive()">나의 아카이브 ↗</button><div class="social-links"><a href="https://x.com/melonadelab" target="_blank" rel="noopener noreferrer" aria-label="MELONADE LAB X (새 탭)" title="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.2-8.3L1.8 2h6.5l4.4 6.7L18.9 2Zm-1.1 18h1.7L7.4 3.9H5.6L17.8 20Z"/></svg></a><a href="https://www.instagram.com/melonade.lab/" target="_blank" rel="noopener noreferrer" aria-label="MELONADE LAB Instagram (새 탭)" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a></div></nav></header><main id="app" class="wrap"></main><div id="toast" role="status"></div><script>
const MOODID_CLIENT_RELEASE='2026-10-26-cache-reset-v1';
function resetLegacyMoodidStorage(storage){try{if(storage.getItem('moodid-client-release')===MOODID_CLIENT_RELEASE)return false;for(const key of Object.keys(storage)){if(key.startsWith('moodid-')&&key!=='moodid-visitor-id')storage.removeItem(key);}storage.setItem('moodid-client-release',MOODID_CLIENT_RELEASE);return true;}catch{return false;}}
try{resetLegacyMoodidStorage(localStorage);}catch{}
try{resetLegacyMoodidStorage(sessionStorage);}catch{}
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
const DB=__DB__;
const PIN_CATALOG=__PINS__;
const RESULT_REFERENCES=__RESULT_REFERENCES__;
const DISCOVERIES=__DISCOVERIES__;
__ENGINE__

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let answers={},step=0,current=null,busy=false;
function read(k,d){try{const v=JSON.parse(localStorage.getItem(k));if(v==null)return d;if(Array.isArray(d)&&!Array.isArray(v))return d;if(d&&typeof d==='object'&&!Array.isArray(d)&&(typeof v!=='object'||Array.isArray(v)))return d;return v}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('저장 공간을 사용할 수 없어요.')}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
const img=['/assets/options/3_0.webp','/assets/options/10_3.webp','/assets/options/6_1.webp'];
function home(){cancelAnalysis();$('#app').innerHTML=`<section class="hero"><div class="eyebrow tiny"><span>MELONADE LAB / PROJECT 03</span><span>DISCOVER YOUR AESTHETIC — 2026</span></div><h1>MOODID.</h1><div class="under"><div class="tagline">당신이 아름답다고 느끼는 것들.<br>그 안에, 당신만의 미감이 있어요.</div><button class="pill" onclick="start()" aria-label="미감 발견 시작">↗</button></div><div class="collage">${img.map((u,i)=>`<div class="photo"><img src="${u}" alt="${['숲에 스며드는 빛','책과 사물의 질감','따뜻한 공간의 분위기'][i]}"><span class="caption">0${i+1} / ${['THE AIR YOU LOVE','THE THINGS YOU FEEL','THE WORLD YOU KEEP'][i]}</span></div>`).join('')}</div><div class="intro"><p>좋아하는 시간, 공기, 색과 소리를 모아보세요.<br>흩어져 있던 취향이 하나의 세계로 이어집니다.</p><div class="start-with-count"><button class="cta" onclick="start()">나의 미감 발견하기 <span>↗</span></button><span class="community-count" data-community-count hidden title="결과를 만든 브라우저 기준 · 같은 브라우저는 한 번 집계 · 집계 시작 이후"></span><p style="font-size:10px;margin:12px 0 0">약 3분 · ${DB.length}개의 감각 · 여러 개 선택 가능</p></div></div></section><div class="rule senses">${DB.map(d=>`<span>${d.en} / ${d.label}</span>`).join('')}</div><section class="about"><div><span class="tiny">YOU ARE MORE THAN A TYPE.</span><h2>취향은 하나의 유형보다<br>훨씬 넓으니까.</h2></div><div><p>차가운 새벽을 좋아하면서 따뜻한 조명에 끌릴 수도 있어요. 모순처럼 보이는 취향도 당신의 세계에서는 자연스럽습니다.</p><p>MOODID는 서로 다른 감각의 공통점과 대비를 발견합니다. 당신이 고른 것들을 바탕으로 미감의 이름, 색, 그리고 새로운 영감을 만나보세요.</p><button class="secondary" onclick="sample()">결과 미리 보기 ↗</button>${completeAnswers(read('moodid-current',null)?.answers)?'<button class="secondary" onclick="resumeResult()">최근 결과 이어보기 ↗</button>':''}<button class="secondary" onclick="restart()">처음부터 새로 시작 ↗</button></div></section>${foot()}`;loadCommunityCount()}

let communityCount=null,completionRequest=null;
function paintCommunityCount(){(document.querySelectorAll?.('[data-community-count]')||[]).forEach(el=>{el.hidden=communityCount===null;if(communityCount!==null)el.textContent=communityCount.toLocaleString('ko-KR')+'명이 미감을 찾았어요';});}
async function loadCommunityCount(){if(!document.querySelectorAll)return;paintCommunityCount();try{const r=await fetch('/api/stats',{signal:AbortSignal.timeout(5000)});if(!r.ok)return;const data=await r.json();if(data.available&&Number.isSafeInteger(data.count)&&data.count>=0){communityCount=data.count;paintCommunityCount();}}catch{}}
async function recordCompletion(snapshot){if(completionRequest||typeof crypto==='undefined')return;const old=read('moodid-visitor-id',null);let id=typeof old==='string'&&/^[a-f0-9-]{36}$/.test(old)?old:null;if(!id){if(!crypto.randomUUID)return;id=crypto.randomUUID();try{localStorage.setItem('moodid-visitor-id',JSON.stringify(id))}catch{return;}}
 completionRequest=(async()=>{try{const r=await fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitorId:id,answers:snapshot}),signal:AbortSignal.timeout(5000)});if(!r.ok)return;const data=await r.json();if(data.available&&Number.isSafeInteger(data.count)&&data.count>=0){communityCount=data.count;paintCommunityCount();}}catch{}finally{completionRequest=null;}})();await completionRequest;}

function foot(){return '<footer class="creator-footer"><a class="creator-link" href="https://melonadelab.co.kr" target="_blank" rel="noopener noreferrer" aria-label="MELONADE LAB 포트폴리오에서 다른 프로젝트 보기 (새 탭)"><span class="creator-label">MOODID를 만든 MELONADE LAB</span><strong>다른 프로젝트 보기 ↗</strong><span class="creator-domain">melonadelab.co.kr</span></a><span class="creator-note">MELONADE LAB. © 2026<br>COLLECT YOUR SENSES. DISCOVER YOUR WORLD.</span></footer>'}
function start(){restart()}
function restart(){cancelAnalysis();answers={};step=0;question()}
function editAnswers(){cancelAnalysis();answers=cleanAnswers(current?.answers||answers);step=0;question()}
function resumeResult(){const r=read('moodid-current',null);if(!r||!completeAnswers(r.answers))return start();cancelAnalysis();current=migrateProfile(r);answers=current.answers;if(!validInterpretation(current))current={...current,...fallback(itemsFor(answers)),ai:false};current.scores=calculate(itemsFor(answers));current.palette=getPalette(itemsFor(answers));result();}
function question(){answers=cleanAnswers(answers);step=Math.max(0,Math.min(DB.length-1,Number.isInteger(step)?step:0));save('moodid-draft',{answers,step});const d=DB[step];$('#app').innerHTML=`<div class="qhead tiny"><span>COLLECT YOUR SENSES</span><span>${String(step+1).padStart(2,'0')} / ${DB.length}</span></div><div class="progress"><i style="width:${(step+1)/DB.length*100}%"></i></div><section class="question"><span class="tiny">${d.en} / ${d.label}</span><h1>${d.q}</h1><p class="muted">이미지와 감각을 함께 느껴보세요. 최대 3개까지, 정답은 없어요.</p><div class="options">${d.options.map((o,j)=>`<button class="option ${(answers[step]||[]).includes(o.id)?'selected':''}" aria-pressed="${(answers[step]||[]).includes(o.id)}" onclick="choose('${o.id}')"><div class="swatch"><img src="/assets/options/${o.id}.webp" alt="${esc(o.name)}의 감각을 표현한 이미지" width="480" height="320" decoding="async"></div><span class="check">${(answers[step]||[]).includes(o.id)?'✓':''}</span><strong>${step===4?'<span class="color-dot" style="background:'+o.color+'"></span>':''}${o.name}</strong><small>${o.en}</small></button>`).join('')}</div><div class="qfoot"><button class="secondary" onclick="back()">← ${step?'이전':'처음으로'}</button><span class="muted">${(answers[step]||[]).length}개 선택</span><button class="cta" onclick="next()" ${!(answers[step]||[]).length?'disabled':''}>${step===DB.length-1?'미감 발견하기':'다음 감각'} <span>→</span></button></div><p class="muted" style="font-size:10px;margin-top:25px">선택 이미지는 AI로 생성한 감각 표현 예시입니다. 선택은 이 브라우저에 저장됩니다. 분석 시 선택한 감각 정보가 Google Gemini로 전송됩니다.</p></section>`}
function choose(id){let a=answers[step]||[];if(a.includes(id))a=a.filter(x=>x!==id);else if(a.length<3)a.push(id);else return toast('최대 3개까지 선택할 수 있어요.');answers[step]=a;question()}function back(){if(step){step--;question()}else home()}function next(){if(!answers[step]?.length)return;if(step<DB.length-1){step++;question();window.scrollTo(0,0)}else analyze()}
function selected(){return DB.flatMap((d,i)=>d.options.filter(o=>(answers[i]||[]).includes(o.id)).map(o=>({...o,category:d.label})))}
function calculate(items){const s={};DB.forEach(d=>{const a=items.filter(x=>x.category===d.label);a.forEach(o=>Object.entries(o.tags).forEach(([k,v])=>s[k]=(s[k]||0)+v/a.length))});return Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([name,v])=>({name,value:Math.round(v/DB.length*100)}))}
function fallback(items){const scores=calculate(items);return {...databaseProfile(items),keywords:scores.slice(0,6).map(s=>s.name),queries:fallbackExplorations(items),sensorySynthesis:synthesizeSenses(items),connection:connectionFallback(items)}}
let analysisGeneration=0,analysisController=null;
function cancelAnalysis(){analysisGeneration++;analysisController?.abort();analysisController=null;busy=false;if(current)current.pending=false;}
function analysisKey(a,f){return JSON.stringify(['sensory-world-v5',DB.map((d,i)=>[...(a[i]||[])].sort()),Object.entries(f||{}).filter(([id,v])=>DISCOVERIES.some(d=>d.id===id)&&(v===1||v===-1)).sort()]);}
async function analyze(regen=false){
 if(!completeAnswers(answers)){toast('모든 감각을 한 개 이상 선택해주세요.');return;}
 const snapshot=cleanAnswers(answers),feedback=read('moodid-discovery-feedback',{}),key=analysisKey(snapshot,feedback);
 if(busy&&current?.pending&&current.cacheKey===key)return;
 analysisController?.abort();analysisController=new AbortController();const controller=analysisController;
 const generation=++analysisGeneration,items=itemsFor(snapshot),cached=read('moodid-ai-cache-v5',{}),hit=!regen&&cached.key===key&&Date.now()-cached.time<86400000&&validInterpretation(cached.data)?cached.data:null;
 current={...(hit||fallback(items)),schemaVersion:5,ai:!!hit,pending:!hit,cacheKey:key,answers:snapshot,scores:calculate(items),palette:getPalette(items),date:new Date().toISOString(),id:Date.now()};
 const profileId=current.id;busy=!hit;save('moodid-current',current);result();recordCompletion(snapshot);if(hit){save('moodid-current',current);return;}
 const timeout=setTimeout(()=>controller.abort(),35000);
 try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:snapshot,feedback,refresh:regen}),signal:controller.signal});let data;try{data=await response.json()}catch{throw Error('AI 서버에 연결하지 못했어요. 기본 결과는 계속 사용할 수 있어요.')}if(!response.ok)throw Error(data.error||'AI 연결에 실패했어요.');if(!validInterpretation(data))throw Error('AI 해석 형식을 확인하지 못했어요. 기본 결과는 그대로 사용할 수 있어요.');if(generation!==analysisGeneration||current?.id!==profileId)return;save('moodid-ai-cache-v5',{key,time:Date.now(),data});Object.assign(current,data,{ai:true,pending:false});}
 catch(e){if(generation!==analysisGeneration||current?.id!==profileId)return;current.pending=false;current.reason=e.name==='AbortError'?'AI 연결이 늦어 기본 결과를 유지했어요. 필요할 때 다시 분석할 수 있어요.':e.message;}
 finally{clearTimeout(timeout);if(generation===analysisGeneration&&current?.id===profileId){busy=false;save('moodid-current',current);const profiles=read('moodid-profiles',[]);if(profiles.some(p=>p.id===profileId))save('moodid-profiles',profiles.map(p=>p.id===profileId?current:p));refreshInterpretation();}}
}
function refreshInterpretation(){
 if(!$('#analysis-title'))return;const r=current,set=(id,text)=>{const el=$(id);if(el)el.textContent=text;};
 if(!r.pending)loadLiveMoodboard(r);
 set('#analysis-title',r.english);set('#analysis-name',r.name);set('#analysis-description',r.description);set('#discover','DISCOVER MY AESTHETIC / '+(r.ai?'GEMINI INTERPRETATION':'DATABASE EDITION'));
 const status=$('#analysis-status');if(status){status.hidden=r.ai;status.textContent=r.ai?'AI 해석을 완성했어요.':r.reason||'기본 미감 결과를 먼저 표시했어요. AI 해석은 아래 버튼으로 다시 시도할 수 있어요.';status.classList.remove('pending-analysis');}
 if($('#analysis-keywords'))$('#analysis-keywords').innerHTML=r.keywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('');
 for(const d of (r.senseRoles||[])){document.querySelectorAll('[data-dna-role]').forEach(p=>{if(p.dataset.dnaRole===d.category)p.textContent=d.role})}
 if(r.connection){set('#connection-title',r.connection.title);set('#connection-text',r.connection.text)}

 if(images.length===0){toast('사진을 불러온 뒤 공유 카드를 저장할 수 있어요.');return;}

 try{
  await document.fonts.ready;
  const bitmaps=await Promise.all(images.slice(0,3).map(async p=>{let blob=referenceBlobs.get(p.id);if(!blob){const response=await fetch(p.image,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('사진을 다시 불러오지 못했어요. 이미지 다시 찾기를 눌러주세요.');blob=await response.blob();}return createImageBitmap(blob);}));
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const x=canvas.getContext('2d');x.fillStyle='#f3f1eb';x.fillRect(0,0,1080,1350);x.fillStyle='#272d29';

  const paletteY=Math.max(photoY+n*h+(n-1)*gap+34,1124);profile.palette.slice(0,5).forEach((c,i)=>{x.fillStyle=c;x.fillRect(64+i*190.4,paletteY,190.4,42);});x.fillStyle='#272d29';text(profile.keywords.join(' / '),paletteY+79,952,18,2);x.font='18px "DM Sans", sans-serif';x.fillText('DISCOVER YOUR AESTHETIC.                         moodid.co.kr',64,1300);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(v=>v?resolve(v):reject(Error('카드 생성에 실패했어요.')),'image/png'));const file=new File([blob],'MOODID-my-aesthetic.png',{type:'image/png'});
  document.getElementById('share-overlay')?.remove();if(shareCardUrl)URL.revokeObjectURL(shareCardUrl);shareCardUrl=URL.createObjectURL(blob);
  const overlay=document.createElement('div');overlay.id='share-overlay';overlay.className='share-overlay';overlay.innerHTML=`<section class="share-dialog" role="dialog" aria-modal="true" aria-label="공유 카드 저장"><button class="share-close" aria-label="닫기">×</button><strong>나의 미감 카드 · 4:5</strong><img src="${shareCardUrl}" alt="사진과 분석이 담긴 나의 미감 공유 카드"><div class="share-dialog-actions"><a class="cta" href="${shareCardUrl}" download="MOODID-my-aesthetic.png">이미지 다운로드 ↓</a><button class="secondary" id="native-card-share" hidden>공유 · 사진에 저장 ↗</button></div><p>모바일에서는 위 이미지를 길게 눌러 사진에 저장할 수도 있어요.</p></section>`;document.body.appendChild(overlay);const close=()=>{overlay.remove();document.removeEventListener('keydown',escape);};const escape=e=>{if(e.key==='Escape')close();};overlay.querySelector('.share-close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close();};document.addEventListener('keydown',escape);
